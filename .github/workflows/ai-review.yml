name: ai-review

# Advisory review of every PR by the read-only `reviewer` persona (ADR 0003, spec 0002).
# Not a required check: the owner decides whether to merge. Rules: REVIEW.md.
on:
  pull_request:
    branches: [trunk]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write # to post the review comment
  id-token: write # required by claude-code-action

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Save the diff and description for the reviewer
        run: |
          mkdir -p .review
          git diff "origin/${{ github.base_ref }}...HEAD" > .review/pr.diff
          gh pr view "$PR" --json title,body --jq '"# " + .title + "\n\n" + .body' > .review/pr.md
          gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | "### " + .user.login + " at " + .created_at + "\n\n" + .body + "\n"' > .review/comments.md

      - name: Review
        id: review
        uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1.0.213
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the StormSafe `reviewer` persona. Read .claude/agents/reviewer.md and follow its instructions exactly.
            Review pull request #${{ github.event.pull_request.number }}: the diff is in .review/pr.diff, and the title and description are in .review/pr.md, and earlier PR comments (including earlier AI reviews) are in .review/comments.md.

            Your final message must be the review itself, in the persona's output format, and nothing else.
          claude_args: >-
            --model sonnet
            --max-turns 30
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,Agent,WebFetch,WebSearch"

      # The workflow posts the review, so the model needs no write or shell access.
      - name: Post the review
        if: success()
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          if [ -s "$EXECUTION_FILE" ]; then
            jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$EXECUTION_FILE" > .review/result.md
            # Unwrap the answer if the model put the whole review in a code fence.
            if head -n 1 .review/result.md | grep -q '^```'; then
              sed -i '1d;$ { /^```$/d }' .review/result.md
            fi
          fi
          if grep -q '^## AI review (advisory)' .review/result.md 2>/dev/null; then
            cp .review/result.md .review/comment.md
            gh pr comment "$PR" --body-file .review/comment.md
          fi

      - name: Note an incomplete review
        if: failure()
        run: |
          gh pr comment "$PR" --body "AI review did not finish (turn cap, timeout, or error). See the workflow run log. This review is advisory; the owner can merge without it."

      - name: Note a skipped review
        if: success()
        run: |
          if [ ! -s .review/comment.md ]; then
            gh pr comment "$PR" --body "AI review produced no review. Likely causes: the PR changes \`ai-review.yml\` (the action only runs a workflow that matches the copy on \`trunk\`), or the model's answer was not in the reviewer's output format. See the workflow run log. This review is advisory; the owner can merge without it."
          fi
