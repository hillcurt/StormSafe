name: ci

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest

  manifests:
    name: manifests, scripts, image pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBERNETES_VERSION: 1.37.0
      # Schema sources pinned by commit (spec 0003 plan).
      K8S_SCHEMAS: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/93153a1458e24e93f386c50f9980d584fcba574b/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.37.1

      - name: Install pinned tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz -C bin kubeconform
          curl -fsSLo shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 -C bin shellcheck-v0.11.0/shellcheck
          curl -fsSLo crane.tar.gz https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  crane.tar.gz" | sha256sum -c -
          tar -xzf crane.tar.gz -C bin crane
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Render and validate every kustomization
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          find deploy -name kustomization.yaml -print0 | while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            out="$RUNNER_TEMP/rendered/$(echo "$dir" | tr / _).yaml"
            echo "::group::kubectl kustomize $dir"
            kubectl kustomize "$dir" > "$out"
            echo "::endgroup::"
          done
          # CRDs come verbatim from the pinned Argo CD manifest; the strict schema set has no
          # CustomResourceDefinition schema, so they are skipped. Everything else is strict.
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location "$K8S_SCHEMAS" -schema-location "$CRD_SCHEMAS" \
            "$RUNNER_TEMP"/rendered/*.yaml deploy/argocd/application.yaml

      - name: Lint scripts
        run: shellcheck scripts/*.sh

      - name: Pinned images are multi-arch with linux/arm64
        run: |
          grep -hoE '^[ -]*image: \S+' "$RUNNER_TEMP"/rendered/*.yaml deploy/cluster/kind-config.yaml \
            | awk '{print $NF}' | sort -u | scripts/check-image-pins.sh
