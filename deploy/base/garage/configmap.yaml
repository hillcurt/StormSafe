# Non-secret Garage config. rpc_secret and admin_token come from the `garage` Secret through
# GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN (statefulset.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    # SQLite, not the LMDB default: the metadata lives on a Docker Desktop shared folder,
    # where memory-mapped databases risk corruption (plan.md).
    db_engine = "sqlite"
    replication_factor = 1

    rpc_bind_addr = "0.0.0.0:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "0.0.0.0:3900"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
